# tests/contract_matrix.toml
#
# SkillRanker test and evidence contract matrix.
# Maps every roadmap implementation boundary to unit/property test identifiers,
# an e2e suite owner, required platforms/features, earliest executable phase,
# and current execution status.
#
# Rule: P0 rows for future product tests are planned, never fake passed results.
# Later phase gates require their complete real cases.

schema_version = 1
created_for_phase = "P0"

